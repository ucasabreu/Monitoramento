spring.datasource.url=${DB_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:15432}/${POSTGRES_DB:monitoramento}}
spring.datasource.username=${POSTGRES_USER:monitoramento}
spring.datasource.password=${POSTGRES_PASSWORD:monitoramento_dev}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'
spring.flyway.enabled=true
spring.sql.init.mode=never
